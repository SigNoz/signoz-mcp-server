name: fuzz

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  invariants:
    name: invariants
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - name: Run bounded fuzz campaign
        timeout-minutes: 4
        run: make test-fuzz FUZZ_TIME=30s
      - name: Save logs and replay inputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-${{ github.run_attempt }}
          path: .fuzz-artifacts/
          include-hidden-files: true
          retention-days: 14
