name: fuzz

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  invariants:
    name: invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - name: Run fuzz campaign
        run: make test-fuzz FUZZ_TIME=30s
      - name: Save logs and failing inputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-${{ github.run_attempt }}
          path: |
            .fuzz-artifacts/**/environment.txt
            .fuzz-artifacts/**/*.log
            .fuzz-artifacts/**/testdata/fuzz/**
          include-hidden-files: true
          retention-days: 14
