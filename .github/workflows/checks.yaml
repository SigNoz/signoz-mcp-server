name: checks

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

jobs:
  # A skipped fork job must not share the required fork-approval status name.
  internal-approval:
    if: |
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      statuses: write
    steps:
      - name: Record that this PR does not need fork approval
        uses: actions/github-script@v7
        with:
          script: |
            const snapshot = context.payload.pull_request;
            const {data: pr} = await github.rest.pulls.get({...context.repo, pull_number: snapshot.number});
            if (pr.state !== 'open' || pr.base.ref !== context.payload.repository.default_branch || pr.head.sha !== snapshot.head.sha) return;
            if (pr.head.repo?.full_name !== `${context.repo.owner}/${context.repo.repo}` || pr.user.login === 'dependabot[bot]') return;
            for (const sha of new Set([snapshot.head.sha, context.sha])) {
              await github.rest.repos.createCommitStatus({
                ...context.repo, sha, context: 'fork-approval', state: 'success',
                description: 'Internal PR: fork approval is not required',
                target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              });
            }

  # The shared ci / fmt job rewrites files without diffing, so it cannot fail on drift.
  fmt:
    if: |
      (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]')
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Install goimports
        run: make install-goimports

      - name: Check formatting
        run: make check-fmt

  repo-docs:
    if: |
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    name: repo-docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Validate plans and doc paths
        env:
          DRAFT: ${{ github.event.pull_request.draft }}
          BASE: origin/${{ github.base_ref }}
        run: |
          if [ "$DRAFT" = "false" ]; then
            make check-repo-docs READY=1 BASE="$BASE"
          else
            make check-repo-docs
          fi
