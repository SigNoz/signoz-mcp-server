name: checks

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - labeled

permissions:
  contents: read

jobs:
  # The shared ci / fmt job rewrites files without diffing, so it cannot fail on drift.
  fmt:
    if: |
      (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]') ||
      (github.event.action == 'labeled' && github.event.label.name == 'safe-to-test')
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Install goimports
        run: make install-goimports

      - name: Check formatting
        run: make check-fmt

  repo-docs:
    name: repo-docs
    runs-on: ubuntu-latest
    steps:
      # A skipped required check can count as passing. Fail before checkout so
      # ready_for_review cannot bypass plan validation with an old approval.
      - name: Require approval before checking fork code
        if: |
          (github.event.pull_request.head.repo.full_name != github.repository || github.event.pull_request.user.login == 'dependabot[bot]') &&
          !(github.event.action == 'labeled' && github.event.label.name == 'safe-to-test')
        run: |
          echo '::error::A maintainer must add safe-to-test to approve checks for this revision. Remove and reapply it if already present.'
          exit 1

      - name: Checkout pull request
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Validate plans and doc paths
        env:
          DRAFT: ${{ github.event.pull_request.draft }}
          BASE: origin/${{ github.base_ref }}
        run: |
          if [ "$DRAFT" = "false" ]; then
            make check-repo-docs READY=1 BASE="$BASE"
          else
            make check-repo-docs
          fi
