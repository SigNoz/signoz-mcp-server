name: e2e

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - labeled
  pull_request_target:
    branches:
      - main
    types:
      - labeled
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  py-fmt:
    if: |
      (github.event_name == 'pull_request' && ! github.event.pull_request.head.repo.fork && github.event.pull_request.user.login != 'dependabot[bot]' && ! contains(github.event.pull_request.labels.*.name, 'safe-to-test')) ||
      (github.event_name == 'pull_request_target' && contains(github.event.pull_request.labels.*.name, 'safe-to-test'))
    uses: signoz/primus.workflows/.github/workflows/py-fmt.yaml@main
    secrets: inherit
    with:
      PRIMUS_REF: main
      PYTHON_VERSION: "3.13"
      PY_SRC: tests
  py-lint:
    if: |
      (github.event_name == 'pull_request' && ! github.event.pull_request.head.repo.fork && github.event.pull_request.user.login != 'dependabot[bot]' && ! contains(github.event.pull_request.labels.*.name, 'safe-to-test')) ||
      (github.event_name == 'pull_request_target' && contains(github.event.pull_request.labels.*.name, 'safe-to-test'))
    uses: signoz/primus.workflows/.github/workflows/py-lint.yaml@main
    secrets: inherit
    with:
      PRIMUS_REF: main
      PYTHON_VERSION: "3.13"
      PY_SRC: tests
  e2e:
    # The suite casts an ephemeral SigNoz and needs no secrets to run, so it
    # runs on every non-fork pull request. Fork PRs run only through the
    # privileged pull_request_target path once a maintainer applies
    # safe-to-test. The license key is optional: empty means community-only.
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && ! github.event.pull_request.head.repo.fork && github.event.pull_request.user.login != 'dependabot[bot]' && ! contains(github.event.pull_request.labels.*.name, 'safe-to-test')) ||
      (github.event_name == 'pull_request_target' && contains(github.event.pull_request.labels.*.name, 'safe-to-test'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: 'read'
    env:
      # A Foundry release carries the SigNoz version its castings render, so
      # this pins what the suite installs.
      FOUNDRY_VERSION: v0.2.17
    steps:
      - name: self-checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
      - name: go-install
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: python-install
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: uv-install
        uses: astral-sh/setup-uv@v6
      - name: foundryctl-install
        run: |
          curl -fsSL https://signoz.io/foundry.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/foundryctl" version
      - name: test-e2e
        env:
          PRIMUS_LICENSE_KEY: ${{ secrets.PRIMUS_LICENSE_KEY }}
        run: |
          make test-e2e E2E_FLAGS="--license-key ${PRIMUS_LICENSE_KEY}"
