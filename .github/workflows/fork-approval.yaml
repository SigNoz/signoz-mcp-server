name: fork-approval
run-name: >-
  ${{ github.event.action == 'labeled' && github.event.label.name == 'safe-to-test' &&
      format('approve-fork #{0} {1} {2}', github.event.number, github.event.pull_request.head.sha, github.event.pull_request.draft && 'draft' || 'ready') ||
      format('reset-fork #{0} {1}', github.event.number, github.event.pull_request.head.sha) }}

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]

permissions: {}

jobs:
  approval:
    if: |
      (github.event.pull_request.head.repo.full_name != github.repository || github.event.pull_request.user.login == 'dependabot[bot]') &&
      (!contains(fromJSON('["labeled", "unlabeled"]'), github.event.action) || github.event.label.name == 'safe-to-test')
    runs-on: ubuntu-latest
    concurrency:
      group: fork-status-${{ github.event.number }}
      queue: max
      cancel-in-progress: false
    permissions:
      actions: write
      pull-requests: write
      statuses: write
    steps:
      # This job only handles GitHub metadata; it never checks out PR code.
      - name: Record approval and dispatch the trusted worker
        uses: actions/github-script@v7
        with:
          script: |
            const snapshot = context.payload.pull_request;
            const {data: pr} = await github.rest.pulls.get({...context.repo, pull_number: snapshot.number});
            if (pr.state !== 'open' || pr.head.sha !== snapshot.head.sha || pr.draft !== snapshot.draft) return;
            const approved = context.payload.action === 'labeled' && context.payload.label?.name === 'safe-to-test';
            const labeled = pr.labels.some(label => label.name === 'safe-to-test');
            if (approved && !labeled) return;
            if (approved) {
              const {data} = await github.rest.repos.getCollaboratorPermissionLevel({...context.repo, username: context.actor});
              if (!['admin', 'maintain', 'write'].includes(data.permission)) {
                throw new Error('safe-to-test must be added by a maintainer with repository write access');
              }
            }
            if (!approved && labeled && !snapshot.labels.some(label => label.name === 'safe-to-test')) return;
            const runPrefix = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/`;
            // The merge revision is the required-status target when GitHub has computed it.
            const revisions = [...new Set([pr.merge_commit_sha, pr.head.sha].filter(Boolean))];
            for (const sha of revisions) {
              const {data} = await github.rest.repos.getCombinedStatusForRef({...context.repo, ref: sha});
              const marker = data.statuses.find(status => status.context === 'contract');
              if (!marker) continue;
              const id = marker.target_url?.startsWith(runPrefix) ? marker.target_url.slice(runPrefix.length) : '';
              if (!/^[1-9][0-9]*$/.test(id)) throw new Error('Unrecognized approval marker');
              const {data: previous} = await github.rest.actions.getWorkflowRun({...context.repo, run_id: Number(id)});
              if (previous.path !== '.github/workflows/fork-approval.yaml' || previous.event !== 'pull_request_target') {
                throw new Error('Approval marker did not originate in the trusted workflow');
              }
              if (previous.run_number > context.runNumber) return;
            }
            const pending = (sha, name) => github.rest.repos.createCommitStatus({
              ...context.repo, sha, context: name, state: 'pending',
              description: approved ? 'Approved revision: validation queued' : 'Waiting for a maintainer to add safe-to-test',
              target_url: `${runPrefix}${context.runId}`,
            });
            // Invalidate the already-required gate and its approval identity before any other mutation.
            for (const sha of revisions) await pending(sha, 'contract');
            if (!approved && labeled) {
              try {
                await github.rest.issues.removeLabel({...context.repo, issue_number: pr.number, name: 'safe-to-test'});
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }
            const contexts = ['fork-approval', 'fork-checks', 'test / go', 'fmt / go', 'deps / go', 'build / go', 'lint / go', 'fmt', 'repo-docs', 'inspector', 'conformance', 'py-fmt / py', 'py-lint / py', 'e2e'];
            for (const sha of revisions) for (const name of contexts) await pending(sha, name);
            if (approved) {
              await github.rest.actions.createWorkflowDispatch({
                ...context.repo, workflow_id: 'fork-ci.yaml', ref: context.payload.repository.default_branch,
                inputs: {pr: String(pr.number), sha: pr.head.sha, merge_sha: pr.merge_commit_sha || '', draft: String(pr.draft), approval_run: String(context.runId)},
              });
            }
