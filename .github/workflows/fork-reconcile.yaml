name: fork-reconcile

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  discover:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      prs: ${{ steps.forks.outputs.prs }}
    steps:
      - uses: actions/github-script@v7
        id: forks
        with:
          script: |
            const prs = await github.paginate(github.rest.pulls.list, {
              ...context.repo, state: 'open', base: context.payload.repository.default_branch, per_page: 100,
            });
            core.setOutput('prs', JSON.stringify(prs.filter(pr => pr.head.repo?.full_name !== `${context.repo.owner}/${context.repo.repo}` || pr.user.login === 'dependabot[bot]').map(pr => pr.number)));

  reconcile:
    needs: discover
    if: needs.discover.outputs.prs != '[]'
    strategy:
      fail-fast: false
      matrix:
        pr: ${{ fromJSON(needs.discover.outputs.prs) }}
    runs-on: ubuntu-latest
    concurrency:
      group: fork-status-${{ matrix.pr }}
      queue: max
      cancel-in-progress: false
    permissions:
      actions: write
      pull-requests: read
      statuses: write
    steps:
      # This runner only reconciles GitHub metadata; it never consumes PR code.
      - uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ matrix.pr }}
        with:
          script: |
            const {data: pr} = await github.rest.pulls.get({...context.repo, pull_number: Number(process.env.PR_NUMBER)});
            if (pr.state !== 'open' || pr.base.ref !== context.payload.repository.default_branch || pr.mergeable !== true || !pr.merge_commit_sha) return;
            if (pr.head.repo?.full_name === `${context.repo.owner}/${context.repo.repo}` && pr.user.login !== 'dependabot[bot]') return;
            const {data: head} = await github.rest.repos.getCombinedStatusForRef({...context.repo, ref: pr.head.sha});
            const marker = head.statuses.find(status => status.context === 'contract');
            if (!marker) return;
            const prefix = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/`;
            const id = marker.target_url?.startsWith(prefix) ? marker.target_url.slice(prefix.length) : '';
            if (!/^[1-9][0-9]*$/.test(id)) throw new Error('Unrecognized approval marker');
            const {data: source} = await github.rest.actions.getWorkflowRun({...context.repo, run_id: Number(id)});
            const titles = [`reset-fork #${pr.number} ${pr.head.sha}`, `approve-fork #${pr.number} ${pr.head.sha} ${pr.draft ? 'draft' : 'ready'}`];
            if (source.event !== 'pull_request_target' || source.path !== '.github/workflows/fork-approval.yaml' || !titles.includes(source.display_title)) {
              throw new Error('Approval marker did not originate in the trusted workflow for this revision');
            }
            const {data: merge} = await github.rest.repos.getCombinedStatusForRef({...context.repo, ref: pr.merge_commit_sha});
            const existing = merge.statuses.find(status => status.context === 'contract');
            if (!existing) {
              await github.rest.repos.createCommitStatus({
                ...context.repo, sha: pr.merge_commit_sha, context: 'contract', state: 'pending',
                description: 'Merge revision awaiting trusted validation', target_url: marker.target_url,
              });
            } else if (existing.state !== 'pending' || existing.target_url !== marker.target_url) return;
            if (marker.state === 'pending' && source.status === 'completed' && source.conclusion === 'failure') {
              await github.rest.actions.reRunWorkflow({...context.repo, run_id: Number(id)});
            }
